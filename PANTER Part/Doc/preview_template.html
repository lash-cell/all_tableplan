<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timetable Maker — Design Preview (ว่าง)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--color-canvas); color: var(--color-text-body); font-family: var(--font-body); font-size: var(--text-md); line-height: var(--leading-normal); }
    .app { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }
    .side { background: var(--color-surface); border-right: var(--border-width) solid var(--color-border); padding: var(--space-6) 0; }
    main { padding: var(--space-8); }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side"></aside>
    <main></main>
  </div>
</body>
</html>
